name: Build and test release archive

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check buildpack shell syntax
        run: |
          for script in bin/compile bin/detect build.sh tests/runtime.test.sh; do
            bash -n "$script"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer unit tests (mock release downloads)
        run: node --test tests/installer.test.cjs
      - name: Build archive and test it on the unmodified Heroku runtime
        run: bash build.sh
      - name: Upload candidate archive (not a published buildpack release)
        uses: actions/upload-artifact@v4
        with:
          name: vips-8.17.1-heroku-24-candidate
          path: build/
          if-no-files-found: error
          retention-days: 14

# Publishing an immutable GitHub release is a separate, reviewed manual action.
# Neither PRs nor pushes publish/overwrite releases or deploy an app.
