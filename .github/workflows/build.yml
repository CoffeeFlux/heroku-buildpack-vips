name: Build and test release archive

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check buildpack shell syntax
        run: |
          for script in bin/compile bin/detect build.sh release.sh tests/runtime.test.sh; do
            bash -n "$script"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer and release unit tests (mock external calls)
        run: node --test tests/*.test.cjs
      - name: Build archive and test it on the unmodified Heroku runtime
        run: bash build.sh
      - name: Upload candidate archive (not a published buildpack release)
        uses: actions/upload-artifact@v4
        with:
          name: heroku-24-candidate
          path: build/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-buildpack-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: heroku-24-candidate
          path: build/
      - name: Publish the tested archive without overwriting an existing release
        run: bash release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
